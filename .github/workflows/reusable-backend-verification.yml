name: Reusable HOMIO Backend and ACRL Verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Backend, T21, and ACRL runtime verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pytest and authentication dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check \
            -r REOS_CONTROL_CENTER/requirements-auth.txt

      - name: Install existing search retrieval dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "qdrant-client==1.20.0"

      - name: Run modular backend verification suite
        uses: ./.github/actions/homio-backend-ci/verification
