name: Reusable HOMIO Backend and ACRL Verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Backend, T21, and ACRL runtime verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homio-b4-ci-only-password
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.0.3
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: reos-development

    steps:
      - name: Checkout exact triggering commit with verified ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pytest and authentication dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check \
            -r REOS_CONTROL_CENTER/requirements-auth.txt

      - name: Install existing search retrieval dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "qdrant-client==1.20.0"

      - name: Verify PostgreSQL integration harness secret transport
        shell: bash
        run: |
          set -euo pipefail
          python REOS_CONTROL_CENTER/backend/scripts/verify_postgres_integration.py --self-test

      - name: Execute real PostgreSQL tenant and runtime-role integration checks
        shell: bash
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_TEST_PASSWORD: homio-b4-ci-only-password
        run: |
          set -euo pipefail
          python REOS_CONTROL_CENTER/backend/scripts/verify_postgres_integration.py

      - name: Verify PostgreSQL concurrency and recovery verifier contract
        shell: bash
        run: |
          set -euo pipefail
          python REOS_CONTROL_CENTER/backend/scripts/verify_postgres_recovery.py --self-test

      - name: Execute PostgreSQL concurrent-write and full fixture backup/restore checks
        shell: bash
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_TEST_PASSWORD: homio-b4-ci-only-password
        run: |
          set -euo pipefail
          python REOS_CONTROL_CENTER/backend/scripts/verify_postgres_recovery.py

      - name: Verify Redis rate-limit integration contract
        shell: bash
        run: |
          set -euo pipefail
          python REOS_CONTROL_CENTER/backend/scripts/verify_redis_rate_limit.py --self-test

      - name: Execute Redis 8 distributed rate-limit concurrency and expiry checks
        shell: bash
        env:
          REDIS_SERVICE_CONTAINER: ${{ job.services.redis.id }}
        run: |
          set -euo pipefail
          python REOS_CONTROL_CENTER/backend/scripts/verify_redis_rate_limit.py

      - name: Verify PostgreSQL migration-ledger bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          python REOS_CONTROL_CENTER/backend/scripts/verify_postgres_migration_ledger.py --self-test

      - name: Execute real PostgreSQL migration-ledger and least-privilege integration checks
        shell: bash
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_TEST_PASSWORD: homio-b4-ci-only-password
        run: |
          set -euo pipefail
          python REOS_CONTROL_CENTER/backend/scripts/verify_postgres_migration_ledger.py

      - name: Run modular backend verification suite
        uses: ./.github/actions/homio-backend-ci/verification
