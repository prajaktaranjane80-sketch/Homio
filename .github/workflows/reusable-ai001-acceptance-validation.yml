name: Reusable AI-001 Acceptance Criteria Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate_acceptance:
    name: Guarded AI-001 acceptance criteria validation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/reos-development' && startsWith(github.event.head_commit.message, '[CONTROL-CENTER-VALIDATE-AI-001-ACCEPTANCE]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: reos-development
      EXPECTED_SHA: ${{ github.sha }}
      VERIFIED_CODE_SHA: ${{ github.sha }}
      ACTIONS_RUN_ID: ${{ github.run_id }}
      ACTIONS_SERVER_URL: ${{ github.server_url }}
      ACTIONS_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Preserve committed line endings
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol native

      - name: Checkout exact verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check \
            -r REOS_CONTROL_CENTER/requirements-auth.txt
          python -m pip install --disable-pip-version-check \
            "qdrant-client==1.20.0"

      - name: Execute guarded acceptance validation
        uses: ./.github/actions/homio-backend-ci/transitions/ai001-acceptance-validation
