name: HOMIO Frontend CI

on:
  push:
    branches:
      - reos-development
    paths:
      - "REOS_CONTROL_CENTER/Frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - reos-development
    paths:
      - "REOS_CONTROL_CENTER/Frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homio-frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-verify:
    name: Frontend verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: REOS_CONTROL_CENTER/Frontend

    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run F01-F05, TypeScript, lint and production build
        run: npm run verify
