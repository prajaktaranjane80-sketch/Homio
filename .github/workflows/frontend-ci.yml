
name: HOMIO Frontend CI

on:
  push:
    branches:
      - reos-development
    paths:
      - "REOS_CONTROL_CENTER/Frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - reos-development
    paths:
      - "REOS_CONTROL_CENTER/Frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homio-frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-verify:
    name: Frontend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: REOS_CONTROL_CENTER/Frontend

    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend contracts, TypeScript, lint, production build and browser review
        run: npm run verify

      - name: Upload desktop, tablet and mobile browser evidence
        if: always() && hashFiles('REOS_CONTROL_CENTER/Frontend/artifacts/visual-review/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homio-frontend-visual-review-${{ github.sha }}
          path: REOS_CONTROL_CENTER/Frontend/artifacts/visual-review/
          if-no-files-found: warn
          retention-days: 14
