name: Bootstrap HOMIO Frontend Lockfile

on:
  push:
    branches:
      - reos-development
    paths:
      - ".github/workflows/bootstrap-frontend-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: homio-frontend-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  generate-lockfile:
    name: Generate and verify dependency lockfile
    if: github.ref == 'refs/heads/reos-development'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: REOS_CONTROL_CENTER/Frontend

    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check lockfile state
        id: lockfile
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Lockfile already exists; refusing to overwrite it."
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate npm lockfile
        if: steps.lockfile.outputs.missing == 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean lockfile installation
        if: steps.lockfile.outputs.missing == 'true'
        run: npm ci --no-audit --no-fund

      - name: Run complete frontend verification
        if: steps.lockfile.outputs.missing == 'true'
        run: npm run verify

      - name: Commit generated lockfile to canonical branch
        if: steps.lockfile.outputs.missing == 'true'
        shell: bash
        env:
          TARGET_BRANCH: reos-development
        run: |
          set -euo pipefail

          test -s package-lock.json

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- package-lock.json

          if git diff --cached --quiet; then
            echo "::error::Generated lockfile has no staged changes."
            exit 1
          fi

          git commit -m "Add reproducible HOMIO frontend dependency lockfile"
          git push origin "HEAD:${TARGET_BRANCH}"
