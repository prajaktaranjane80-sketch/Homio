name: Reusable CORE-008 Acceptance Criteria Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate_acceptance:
    name: Guarded CORE-008 acceptance criteria validation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/reos-development' && startsWith(github.event.head_commit.message, '[CONTROL-CENTER-VALIDATE-CORE-008-ACCEPTANCE]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_SHA: ${{ github.sha }}
      VERIFIED_CODE_SHA: ${{ github.sha }}
      ACTIONS_RUN_ID: ${{ github.run_id }}
      ACTIONS_SERVER_URL: ${{ github.server_url }}
      ACTIONS_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Preserve committed line endings
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol native

      - name: Checkout exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check \
            -r REOS_CONTROL_CENTER/requirements-auth.txt

      - name: Execute guarded acceptance validation
        uses: ./.github/actions/homio-backend-ci/transitions/core008-acceptance-validation
