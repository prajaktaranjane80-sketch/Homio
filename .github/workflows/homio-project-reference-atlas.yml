name: HOMIO Project Reference Atlas

on:
  push:
    branches:
      - reos-development

  pull_request:
    branches:
      - reos-development

  workflow_run:
    workflows:
      - HOMIO Backend and ACRL Runtime CI
      - HOMIO Frontend CI
      - HOMIO Guarded B4 Recovery Reopen
    types:
      - completed

  workflow_dispatch:

  repository_dispatch:
    types:
      - homio_reference_atlas_refresh

  schedule:
    - cron: "17 2 * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: homio-project-reference-atlas-${{ github.repository }}-${{ github.event.pull_request.number || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPATH: ${{ github.workspace }}/REOS_CONTROL_CENTER

jobs:
  validate-pull-request:
    name: Validate Atlas contract for pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout pull request source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Verify Atlas and EntryPoint updater regression tests
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest discover \
            -s REOS_CONTROL_CENTER/AUTONOMY_ENGINE/continuity/acrl/T16_Repository_Intelligence_File_Discovery/project_reference_atlas \
            -p "test_*.py" \
            -v

      - name: Verify generator and updater compile
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            REOS_CONTROL_CENTER/AUTONOMY_ENGINE/continuity/acrl/T16_Repository_Intelligence_File_Discovery/project_reference_atlas/project_reference_atlas.py \
            REOS_CONTROL_CENTER/AUTONOMY_ENGINE/continuity/acrl/T16_Repository_Intelligence_File_Discovery/project_reference_atlas/update_entrypoint_atlas_reference.py

  generate-and-publish:
    name: Generate source-bound Atlas and EntryPoint replacement
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        (
          github.event_name != 'workflow_run' ||
          (
            github.event.workflow_run.head_branch == 'reos-development' &&
            github.event.workflow_run.head_repository.full_name == github.repository
          )
        )
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 25

    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout the canonical source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: reos-development
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Confirm canonical repository and source branch
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REPOSITORY}" = "prajaktaranjane80-sketch/Homio"
          test "$(git branch --show-current)" = "reos-development"
          test "$(git config --get remote.origin.url)" = \
            "https://github.com/prajaktaranjane80-sketch/Homio.git"

      - name: Run Atlas and EntryPoint updater contract tests
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest discover \
            -s REOS_CONTROL_CENTER/AUTONOMY_ENGINE/continuity/acrl/T16_Repository_Intelligence_File_Discovery/project_reference_atlas \
            -p "test_*.py" \
            -v

      - name: Verify canonical ACRL T16 package import boundary
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import importlib

          modules = (
              "REOS_CONTROL_CENTER.AUTONOMY_ENGINE.continuity.acrl."
              "T16_Repository_Intelligence_File_Discovery.repository_intelligence",
              "REOS_CONTROL_CENTER.AUTONOMY_ENGINE.continuity.acrl."
              "T16_Repository_Intelligence_File_Discovery.source_intelligence.source_parser",
              "REOS_CONTROL_CENTER.AUTONOMY_ENGINE.continuity.acrl."
              "T16_Repository_Intelligence_File_Discovery.source_intelligence.web_source_parser",
          )

          for name in modules:
              importlib.import_module(name)

          print("ACRL_T16_CANONICAL_IMPORT=PASS")
          PY

      - name: Generate complete source-bound Atlas
        shell: bash
        run: |
          set -euo pipefail

          python \
            REOS_CONTROL_CENTER/AUTONOMY_ENGINE/continuity/acrl/T16_Repository_Intelligence_File_Discovery/project_reference_atlas/project_reference_atlas.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/HOMIO_PROJECT_REFERENCE_ATLAS.json" \
            --expected-branch reos-development \
            --require-live-tip

      - name: Generate complete lossless EntryPoint replacement
        shell: bash
        run: |
          set -euo pipefail

          python \
            REOS_CONTROL_CENTER/AUTONOMY_ENGINE/continuity/acrl/T16_Repository_Intelligence_File_Discovery/project_reference_atlas/update_entrypoint_atlas_reference.py \
            --source REOS_CONTROL_CENTER/AI_AGENT_ENTRYPOINT.py \
            --output "$RUNNER_TEMP/AI_AGENT_ENTRYPOINT.py"

          python -m py_compile \
            "$RUNNER_TEMP/AI_AGENT_ENTRYPOINT.py"

          python - \
            "$GITHUB_WORKSPACE/REOS_CONTROL_CENTER/AI_AGENT_ENTRYPOINT.py" \
            "$RUNNER_TEMP/AI_AGENT_ENTRYPOINT.py" \
            "$RUNNER_TEMP/HOMIO_PROJECT_REFERENCE_ATLAS.json" <<'PY'
          import ast
          import json
          import pathlib
          import sys

          original_path = pathlib.Path(sys.argv[1])
          candidate_path = pathlib.Path(sys.argv[2])
          atlas_path = pathlib.Path(sys.argv[3])

          original = original_path.read_text(encoding="utf-8-sig")
          candidate = candidate_path.read_text(encoding="utf-8")
          atlas = json.loads(
              atlas_path.read_text(encoding="utf-8")
          )

          ast.parse(candidate)

          required = (
              "PROJECT_REFERENCE_ATLAS_REFERENCE",
              "PROJECT_REFERENCE_ATLAS_RULES",
              "project_reference_atlas_rules",
              "project_reference_atlas_generation",
              "reos-project-reference",
              "HOMIO_PROJECT_REFERENCE_ATLAS.json",
          )

          missing = [
              item for item in required
              if item not in candidate
          ]

          if missing:
              raise SystemExit(
                  "Generated EntryPoint is incomplete: "
                  + ", ".join(missing)
              )

          if len(candidate.splitlines()) < len(original.splitlines()):
              raise SystemExit(
                  "Generated EntryPoint is unexpectedly shorter "
                  "than the original source."
              )

          if not atlas["source_baseline"]["source_commit_sha"]:
              raise SystemExit(
                  "Atlas source commit identity is missing."
              )

          manifest = pathlib.Path(
              candidate_path.parent
              / "HOMIO_REFERENCE_GENERATED_MANIFEST.txt"
          )

          manifest.write_text(
              "EntryPoint replacement generated from exact source commit: "
              + atlas["source_baseline"]["source_commit_sha"]
              + "\nSource tree SHA: "
              + atlas["source_baseline"]["source_tree_sha"]
              + "\nState JSON blob SHA: "
              + atlas["source_baseline"]["state_json_blob_sha"]
              + "\nOriginal EntryPoint lines: "
              + str(len(original.splitlines()))
              + "\nGenerated EntryPoint lines: "
              + str(len(candidate.splitlines()))
              + "\nAtlas status: "
              + atlas["status"]
              + "\n",
              encoding="utf-8",
          )

          print("ENTRYPOINT_REPLACEMENT_VALID=PASS")
          PY

      - name: Verify source branch is still the exact generated baseline
        id: source-guard
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(
            jq -r \
              '.source_baseline.source_commit_sha' \
              "$RUNNER_TEMP/HOMIO_PROJECT_REFERENCE_ATLAS.json"
          )"

          live_sha="$(
            git ls-remote origin refs/heads/reos-development |
            awk '{print $1}'
          )"

          test -n "$live_sha"
          test "$source_sha" = "$live_sha"

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare isolated reference branch
        shell: bash
        env:
          ATLAS_BRANCH: reos-project-reference
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin \
            "refs/heads/${ATLAS_BRANCH}" >/dev/null 2>&1; then

            git fetch --no-tags origin \
              "refs/heads/${ATLAS_BRANCH}:refs/remotes/origin/${ATLAS_BRANCH}"

            git switch --force-create \
              "${ATLAS_BRANCH}" \
              "refs/remotes/origin/${ATLAS_BRANCH}"
          else
            git switch --orphan "${ATLAS_BRANCH}"
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi

          mkdir -p REOS_CONTROL_CENTER

          cp \
            "$RUNNER_TEMP/HOMIO_PROJECT_REFERENCE_ATLAS.json" \
            REOS_CONTROL_CENTER/HOMIO_PROJECT_REFERENCE_ATLAS.json

          git add -- \
            REOS_CONTROL_CENTER/HOMIO_PROJECT_REFERENCE_ATLAS.json

          if git diff --cached --quiet; then
            echo "ATLAS_NO_CHANGE=true" >> "$GITHUB_ENV"
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git commit \
              -m "chore(reference): publish HOMIO Atlas for ${{ steps.source-guard.outputs.source_sha }}"

            echo "ATLAS_NO_CHANGE=false" >> "$GITHUB_ENV"
          fi

      - name: Re-check source SHA before publication
        shell: bash
        run: |
          set -euo pipefail

          live_sha="$(
            git ls-remote origin refs/heads/reos-development |
            awk '{print $1}'
          )"

          test -n "$live_sha"
          test "$live_sha" = "${{ steps.source-guard.outputs.source_sha }}"

      - name: Publish reference branch
        if: env.ATLAS_NO_CHANGE == 'false'
        shell: bash
        run: |
          set -euo pipefail

          git push origin \
            "HEAD:refs/heads/reos-project-reference"

      - name: Confirm source branch did not move during publication
        shell: bash
        run: |
          set -euo pipefail

          live_sha="$(
            git ls-remote origin refs/heads/reos-development |
            awk '{print $1}'
          )"

          test -n "$live_sha"
          test "$live_sha" = "${{ steps.source-guard.outputs.source_sha }}"

      - name: Upload generated Atlas and EntryPoint replacement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: homio-reference-generated-${{ steps.source-guard.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/HOMIO_PROJECT_REFERENCE_ATLAS.json
            ${{ runner.temp }}/AI_AGENT_ENTRYPOINT.py
            ${{ runner.temp }}/HOMIO_REFERENCE_GENERATED_MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
