
name: Reusable AI-001-T10 Approval and Freeze

on:
  workflow_call:

permissions:
  contents: read

jobs:
  approve_gate:
    name: Guarded AI-001 final approval and freeze
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/reos-development' && startsWith(github.event.head_commit.message, '[CONTROL-CENTER-APPROVE-AI-001]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_SHA: ${{ github.sha }}
      VERIFIED_CODE_SHA: ${{ github.sha }}
      ACTIONS_RUN_ID: ${{ github.run_id }}
      ACTIONS_SERVER_URL: ${{ github.server_url }}
      ACTIONS_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Preserve committed line endings configuration
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol native

      - name: Checkout exact approval-trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute guarded AI-001 T10 approval and canonical readback
        uses: ./.github/actions/homio-backend-ci/transitions/ai001-t10-approval
