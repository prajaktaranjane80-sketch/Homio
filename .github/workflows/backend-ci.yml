name: HOMIO Backend and ACRL Runtime CI

on:
  push:
    branches:
      - reos-development
    paths:
      - "REOS_CONTROL_CENTER/AUTONOMY_ENGINE/**"
      - "REOS_CONTROL_CENTER/Frontend/**"
      - "REOS_CONTROL_CENTER/context/**"
      - "REOS_CONTROL_CENTER/tets/**"
      - "REOS_CONTROL_CENTER/reos_control_center.py"
      - "REOS_CONTROL_CENTER/data/state.json"
      - "REOS_CONTROL_CENTER/requirements-auth.txt"
      - "REOS_CONTROL_CENTER/AI_AGENT_ENTRYPOINT.py"
      - "REOS_CONTROL_CENTER/evidence/**"
      - "REOS_CONTROL_CENTER/packets/**"
      - "REOS_CONTROL_CENTER/REOS_NEXT_CHAT.txt"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/reusable-backend-verification.yml"
      - ".github/workflows/reusable-ai001-t01-transition.yml"
      - ".github/workflows/reusable-ai001-t02-transition.yml"
      - ".github/workflows/reusable-ai001-t03-transition.yml"
      - ".github/workflows/reusable-ai001-t04-transition.yml"
      - ".github/workflows/reusable-ai001-t05-transition.yml"
      - ".github/workflows/reusable-ai001-t06-transition.yml"
      - ".github/workflows/reusable-ai001-t07-transition.yml"
      - ".github/workflows/reusable-ai001-t08-transition.yml"
      - ".github/workflows/reusable-ai001-t09-transition.yml"
      - ".github/workflows/reusable-ai001-acceptance-validation.yml"
      - ".github/workflows/reusable-ai001-t10-approval.yml"
      - ".github/workflows/reusable-core008-t06-transition.yml"
      - ".github/workflows/reusable-core008-t07-transition.yml"
      - ".github/workflows/reusable-core008-t08-transition.yml"
      - ".github/workflows/reusable-core008-t09-transition.yml"
      - ".github/workflows/reusable-core008-acceptance-validation.yml"
      - ".github/workflows/reusable-core008-t10-approval.yml"
      - ".github/actions/homio-backend-ci/**"

  pull_request:
    branches:
      - reos-development

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homio-backend-acrl-ci-${{ github.ref }}
  cancel-in-progress: false

# Verification never changes canonical task state by itself.
# AI-001 transitions require separate owner/branch/commit-prefix guards.
# CORE-008 transitions retain their existing guards.

jobs:
  verification:
    name: Backend, T21, and ACRL runtime verification
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-backend-verification.yml

  control_center_transition_ai001_t01:
    name: Guarded Control Center transition (AI-001-T01)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/reos-development' && startsWith(github.event.head_commit.message, '[CONTROL-CENTER-COMPLETE-AI-001-T01]') }}
    needs: verification
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-ai001-t01-transition.yml

  control_center_transition_ai001_t02:
    name: Guarded Control Center transition (AI-001-T02)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/reos-development' && startsWith(github.event.head_commit.message, '[CONTROL-CENTER-COMPLETE-AI-001-T02]') }}
