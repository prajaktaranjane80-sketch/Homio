name: HOMIO Backend and ACRL Runtime CI

on:
  push:
    branches:
      - reos-development
    paths:
      - "REOS_CONTROL_CENTER/AUTONOMY_ENGINE/**"
      - "REOS_CONTROL_CENTER/Frontend/**"
      - "REOS_CONTROL_CENTER/context/**"
      - "REOS_CONTROL_CENTER/tets/**"
      - "REOS_CONTROL_CENTER/reos_control_center.py"
      - "REOS_CONTROL_CENTER/data/state.json"
      - "REOS_CONTROL_CENTER/requirements-auth.txt"
      - "REOS_CONTROL_CENTER/AI_AGENT_ENTRYPOINT.py"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - reos-development
    paths:
      - "REOS_CONTROL_CENTER/AUTONOMY_ENGINE/**"
      - "REOS_CONTROL_CENTER/Frontend/**"
      - "REOS_CONTROL_CENTER/context/**"
      - "REOS_CONTROL_CENTER/tets/**"
      - "REOS_CONTROL_CENTER/reos_control_center.py"
      - "REOS_CONTROL_CENTER/data/state.json"
      - "REOS_CONTROL_CENTER/requirements-auth.txt"
      - "REOS_CONTROL_CENTER/AI_AGENT_ENTRYPOINT.py"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homio-backend-acrl-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verification:
    name: Backend, T21, and ACRL runtime verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: REOS_CONTROL_CENTER
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest and authentication dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -r requirements-auth.txt

      - name: Compile backend and ACRL runtime modules
        run: |
          python -m compileall -q \
            reos_control_center.py \
            AI_AGENT_ENTRYPOINT.py \
            context \
            AUTONOMY_ENGINE/continuity/acrl/T07_New_Chat_Bootstrap \
            AUTONOMY_ENGINE/continuity/acrl/T14_Repository_Intelligence_Context \
            AUTONOMY_ENGINE/continuity/acrl/T16_Repository_Intelligence_File_Discovery \
            AUTONOMY_ENGINE/continuity/acrl/T17_Change_Impact_Dependency_Analysis \
            AUTONOMY_ENGINE/continuity/acrl/T18_Safe_Execution_Authorization_Guard \
            AUTONOMY_ENGINE/continuity/acrl/T19_Intelligent_Test_Selection_Failure_Diagnosis \
            AUTONOMY_ENGINE/continuity/acrl/T20_Autonomous_Repair_Patch_Verification \
            AUTONOMY_ENGINE/continuity/acrl/T21_Git_Repository_Read_Write_Coordination \
            AUTONOMY_ENGINE/continuity/acrl/T22_Commit_Execution_Checkpoint_Coordination \
            AUTONOMY_ENGINE/continuity/acrl/T23_Reference_Evidence_Resolution_Engine \
            AUTONOMY_ENGINE/continuity/acrl/T24_Cross_Chat_Continuity_Recovery_Engine \
            AUTONOMY_ENGINE/continuity/acrl/runtime_integration

      - name: Require and run EntryPoint contract regression
        run: |
          python -c "from pathlib import Path; p = Path('tets/test_ai_agent_entrypoint_contract.py'); assert p.is_file(), f'Required contract test is missing: {p}'"
          python -m pytest -q tets/test_ai_agent_entrypoint_contract.py

      - name: Run ACRL runtime-integration regressions
        run: |
          python -m pytest -q \
            AUTONOMY_ENGINE/continuity/acrl/runtime_integration

      - name: Run T07 and T14 fast-resume regressions
        run: |
          python -m pytest -q \
            AUTONOMY_ENGINE/continuity/acrl/T14_Repository_Intelligence_Context/test_audit_resume_manifest.py \
            AUTONOMY_ENGINE/continuity/acrl/T14_Repository_Intelligence_Context/test_repository_context.py \
            AUTONOMY_ENGINE/continuity/acrl/T07_New_Chat_Bootstrap/test_fast_resume_and_stale_manifest.py \
            AUTONOMY_ENGINE/continuity/acrl/T07_New_Chat_Bootstrap/test_new_chat_bootstrap.py \
            AUTONOMY_ENGINE/continuity/acrl/T07_New_Chat_Bootstrap/test_checkpoint_state_coherence.py

      - name: Run T18 authenticated-approval regressions
        run: |
          python -m pytest -q \
            AUTONOMY_ENGINE/continuity/acrl/T18_Safe_Execution_Authorization_Guard

      - name: Run T16 and T17 source-impact regressions
        run: |
          python -m pytest -q \
            AUTONOMY_ENGINE/continuity/acrl/T16_Repository_Intelligence_File_Discovery \
            AUTONOMY_ENGINE/continuity/acrl/T17_Change_Impact_Dependency_Analysis

      - name: Run T19 intelligent test-selection regressions
        run: |
          python -m pytest -q \
            AUTONOMY_ENGINE/continuity/acrl/T19_Intelligent_Test_Selection_Failure_Diagnosis

      - name: Run T20 patch-verification regressions
        run: |
          python -m pytest -q \
            AUTONOMY_ENGINE/continuity/acrl/T20_Autonomous_Repair_Patch_Verification

      - name: Run T21 Git coordination and API recovery regressions
        run: |
          python -m pytest -q \
            AUTONOMY_ENGINE/continuity/acrl/T21_Git_Repository_Read_Write_Coordination

      - name: Run T22 commit-checkpoint regressions
        run: |
          python -m pytest -q \
            AUTONOMY_ENGINE/continuity/acrl/T22_Commit_Execution_Checkpoint_Coordination

      - name: Run T23 evidence-resolution and T24 continuity regressions
        run: |
          python -m pytest -q \
            AUTONOMY_ENGINE/continuity/acrl/T23_Reference_Evidence_Resolution_Engine \
            AUTONOMY_ENGINE/continuity/acrl/T24_Cross_Chat_Continuity_Recovery_Engine

      - name: Run canonical truth, authentication, finance, context, and tenant regressions
        run: |
          python -m pytest -q \
            AUTONOMY_ENGINE/continuity/canonical_truth/STAGE0_Canonical_Truth_Sync_Engine \
            AUTONOMY_ENGINE/security/authentication \
            AUTONOMY_ENGINE/core/commission_financial \
            tets/test_l3_canonical_authority.py \
            context/test_phase_projection.py \
            AUTONOMY_ENGINE/core/identity_tenant

      - name: Run complete ACRL suite
        run: |
          python -m pytest -q \
            AUTONOMY_ENGINE/continuity/acrl

  control_center_transition:
    name: Guarded Control Center transition (explicit commit authorization)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/reos-development' && startsWith(github.event.head_commit.message, '[CONTROL-CENTER-COMPLETE-CORE-008-T04]') }}
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Preserve committed line endings before checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol native

      - name: Checkout the exact commit that passed verification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fail closed unless canonical branch and tested HEAD are unchanged
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_ACTOR" != "prajaktaranjane80-sketch" ]]; then
            echo "BLOCKED: only the repository owner may authorize the explicit Control Center transition commit."
            exit 1
          fi

          if [[ "$GITHUB_REF" != "refs/heads/reos-development" ]]; then
            echo "BLOCKED: Control Center transition is allowed only from reos-development."
            exit 1
          fi

          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "BLOCKED: checkout SHA differs from the verified workflow SHA."
            echo "expected=$EXPECTED_SHA actual=$ACTUAL_SHA"
            exit 1
          fi

          git fetch --no-tags origin refs/heads/reos-development
          REMOTE_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "$REMOTE_SHA" != "$EXPECTED_SHA" ]]; then
            echo "BLOCKED: canonical branch moved after the workflow was dispatched."
            echo "expected=$EXPECTED_SHA remote=$REMOTE_SHA"
            exit 1
          fi

          echo "CHECKOUT_LINE_ENDING_POLICY:"
          git config --show-origin --get core.autocrlf || true

          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "CHECKOUT_PREFLIGHT: checking whether changes are only CRLF/LF checkout drift."

            if [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
              echo "BLOCKED: checkout contains unexpected untracked files."
              git status --short
              exit 1
            fi

            if ! git diff --cached --quiet; then
              echo "BLOCKED: checkout contains staged changes."
              git status --short
              git diff --cached --stat
              exit 1
            fi

            if ! git diff --quiet --ignore-cr-at-eol --; then
              echo "BLOCKED: checkout contains substantive changes, not only CRLF/LF drift."
              git status --short
              git diff --stat
              git diff --ignore-cr-at-eol --stat || true
              exit 1
            fi

            python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          result = subprocess.run(
              ["git", "diff", "--name-only", "-z"],
              check=True,
              capture_output=True,
          )

          raw_paths = [
              value
              for value in result.stdout.split(b"\0")
              if value
          ]

          for raw_path in raw_paths:
              path = Path(os.fsdecode(raw_path))
              data = path.read_bytes()
              normalized = data.replace(b"\r\n", b"\n")
              if normalized != data:
                  path.write_bytes(normalized)
          PY

            if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
              echo "BLOCKED: working tree did not become clean after CRLF-only normalization."
              git status --short
              git diff --stat
              git diff --ignore-cr-at-eol --stat || true
              exit 1
            fi

            echo "CHECKOUT_PREFLIGHT PASS: normalized CRLF-only worktree drift; repository content remains unchanged."
          fi

          python REOS_CONTROL_CENTER/reos_control_center.py verify-state

          python - <<'PY'
          import json
          from pathlib import Path

          state_path = Path("REOS_CONTROL_CENTER/data/state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          execution = state.get("execution", {})
          gate = state.get("gate_plans", {}).get("CORE-008", {})
          subtasks = {item.get("id"): item for item in gate.get("subtasks", [])}
          criteria = {
              item.get("id"): item.get("status")
              for item in gate.get("criteria_state", [])
          }

          expected_criteria = {
              "CORE-008-AC01": "PENDING",
              "CORE-008-AC02": "VERIFIED",
              "CORE-008-AC03": "VERIFIED",
              "CORE-008-AC04": "PENDING",
              "CORE-008-AC05": "PENDING",
              "CORE-008-AC06": "PENDING",
          }

          if execution.get("current_gate") != "CORE-008":
              raise SystemExit("BLOCKED: current gate is not CORE-008.")
          if execution.get("current_subtask") != "CORE-008-T04":
              raise SystemExit("BLOCKED: CORE-008-T04 is no longer the canonical current subtask.")
          if gate.get("status") != "CURRENT":
              raise SystemExit("BLOCKED: CORE-008 gate is not CURRENT.")
          if subtasks.get("CORE-008-T04", {}).get("status") != "CURRENT":
              raise SystemExit("BLOCKED: CORE-008-T04 is not CURRENT.")
          if subtasks.get("CORE-008-T05", {}).get("status") != "PENDING":
              raise SystemExit("BLOCKED: CORE-008-T05 is not PENDING.")
          if criteria != expected_criteria:
              raise SystemExit(
                  "BLOCKED: acceptance-criterion status differs from the reviewed baseline; "
                  f"observed={criteria!r}"
              )

          evidence_path = Path(
              "REOS_CONTROL_CENTER/evidence/CORE-008/"
              "T04-settlement-reconciliation-ci-evidence.md"
          )
          evidence = evidence_path.read_text(encoding="utf-8")

          if "## 9. Post-transition Control Center Readback" in evidence:
              raise SystemExit("BLOCKED: T04 transition evidence already contains a post-transition record.")
          if "After this document is saved:" not in evidence:
              raise SystemExit("BLOCKED: expected T04 evidence checklist was not found.")
          if "The evidence record requires synchronization" not in evidence:
              raise SystemExit("BLOCKED: expected pre-transition disposition was not found.")

          print("PREFLIGHT PASS: T04 is current, criteria are unchanged, evidence is ready for transition record.")
          PY

      - name: Complete CORE-008-T04 through the existing Control Center
        env:
          VERIFIED_CODE_SHA: ${{ github.sha }}
          ACTIONS_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          NOTE="CORE-008-T04 completed through the existing Control Center after configured commission_financial and complete ACRL suites passed in GitHub Actions run ${ACTIONS_RUN_ID} for verified code commit ${VERIFIED_CODE_SHA}. Acceptance criteria were not bulk-verified; AC01, AC04, AC05 and AC06 remain pending."
          export CONTROL_CENTER_TRANSITION_NOTE="$NOTE"

          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          import REOS_CONTROL_CENTER.reos_control_center as control_center

          control_center.PACKETS = Path("REOS_CONTROL_CENTER/packets")
          sys.argv = [
              "reos_control_center.py",
              "complete-subtask",
              "CORE-008-T04",
              "--note",
              os.environ["CONTROL_CENTER_TRANSITION_NOTE"],
          ]
          control_center.main()
          PY

          python REOS_CONTROL_CENTER/reos_control_center.py verify-state

      - name: Verify generated state and update T04 evidence record
        env:
          VERIFIED_CODE_SHA: ${{ github.sha }}
          ACTIONS_RUN_ID: ${{ github.run_id }}
          ACTIONS_SERVER_URL: ${{ github.server_url }}
          ACTIONS_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import textwrap
          from pathlib import Path

          root = Path("REOS_CONTROL_CENTER")
          state_path = root / "data" / "state.json"
          packet_path = root / "packets" / "NEW_CHAT_PACKET.txt"
          next_chat_path = root / "REOS_NEXT_CHAT.txt"
          evidence_path = (
              root / "evidence" / "CORE-008"
              / "T04-settlement-reconciliation-ci-evidence.md"
          )

          state = json.loads(state_path.read_text(encoding="utf-8"))
          execution = state.get("execution", {})
          gate = state.get("gate_plans", {}).get("CORE-008", {})
          subtasks = {item.get("id"): item for item in gate.get("subtasks", [])}
          criteria = {
              item.get("id"): item.get("status")
              for item in gate.get("criteria_state", [])
          }

          expected_criteria = {
              "CORE-008-AC01": "PENDING",
              "CORE-008-AC02": "VERIFIED",
              "CORE-008-AC03": "VERIFIED",
              "CORE-008-AC04": "PENDING",
              "CORE-008-AC05": "PENDING",
              "CORE-008-AC06": "PENDING",
          }

          if execution.get("current_gate") != "CORE-008":
              raise SystemExit("POST-CHECK FAILED: current gate changed unexpectedly.")
          if execution.get("current_subtask") != "CORE-008-T05":
              raise SystemExit("POST-CHECK FAILED: controller did not advance current subtask to T05.")
          if state.get("session", {}).get("last_handoff") != "REOS_CONTROL_CENTER/packets/NEW_CHAT_PACKET.txt":
              raise SystemExit("POST-CHECK FAILED: handoff reference is not the portable repository-relative path.")
          if subtasks.get("CORE-008-T04", {}).get("status") != "DONE":
              raise SystemExit("POST-CHECK FAILED: T04 is not DONE.")
          if subtasks.get("CORE-008-T05", {}).get("status") != "CURRENT":
              raise SystemExit("POST-CHECK FAILED: T05 is not CURRENT.")
          if criteria != expected_criteria:
              raise SystemExit("POST-CHECK FAILED: gate acceptance criteria changed unexpectedly.")

          packet = packet_path.read_text(encoding="utf-8")
          next_chat = next_chat_path.read_text(encoding="utf-8")

          for name, packet_text in (
              ("Control Center packet", packet),
              ("next-chat handoff", next_chat),
          ):
              if "CURRENT_SUBTASK=CORE-008-T05" not in packet_text:
                  raise SystemExit(f"POST-CHECK FAILED: {name} does not identify T05 as current.")
              if "CORE-008-T04|DONE|Implement settlement and reconciliation lifecycle" not in packet_text:
                  raise SystemExit(f"POST-CHECK FAILED: {name} does not record T04 as DONE.")

          evidence = evidence_path.read_text(encoding="utf-8")
          marker = "## 9. Post-transition Control Center Readback"

          if marker in evidence:
              raise SystemExit("POST-CHECK FAILED: duplicate post-transition evidence section.")

          pattern = re.compile(
              r"\*\*Disposition:\*\* The T04 source and tests have successful current-commit CI evidence\.\s+"
              r"The evidence record requires synchronization, followed by the prescribed Control Center transition and read-back\.\s+"
              r"A green test result is not itself a canonical state transition\."
          )

          if len(pattern.findall(evidence)) != 1:
              raise SystemExit("POST-CHECK FAILED: expected pre-transition disposition was not found exactly once.")

          evidence = pattern.sub(
              "**Pre-transition disposition (superseded by Section 9):** The test evidence was reconciled before the Control Center transition.",
              evidence,
              count=1,
          )

          evidence = evidence.replace(
              "After this document is saved:",
              "Pre-transition checklist (completed and read back as recorded in Section 9):",
              1,
          )

          checklist_start = evidence.find(
              "Pre-transition checklist (completed and read back as recorded in Section 9):"
          )
          checklist_end = evidence.find(
              "\nDo not edit `state.json` manually.",
              checklist_start,
          )

          if checklist_start < 0 or checklist_end < 0:
              raise SystemExit("POST-CHECK FAILED: cannot update the completed transition checklist safely.")

          checklist_end = evidence.rfind("\n", checklist_start, checklist_end)
          evidence = evidence[:checklist_start] + (
              "Pre-transition checklist (completed and read back as recorded in Section 9):\n\n"
              "The existing Control Center transition ran after all configured verification jobs passed. "
              "The resulting canonical state and both generated handoff files were checked before the evidence record was updated."
          ) + evidence[checklist_end:]

          blob_sha = subprocess.check_output(
              ["git", "hash-object", str(state_path)],
              text=True,
          ).strip()

          run_url = (
              f"{os.environ['ACTIONS_SERVER_URL']}/"
              f"{os.environ['ACTIONS_REPOSITORY']}/actions/runs/"
              f"{os.environ['ACTIONS_RUN_ID']}"
          )

          section = textwrap.dedent(f"""

          ## 9. Post-transition Control Center Readback

          - Control Center transition: `CORE-008-T04` was marked `DONE` by `REOS_CONTROL_CENTER/reos_control_center.py complete-subtask`; `state.json` was not manually edited.
          - Verified code/test commit: `{os.environ['VERIFIED_CODE_SHA']}`.
          - GitHub Actions run (verification passed before transition): {run_url}
          - Canonical `state.json` Git blob SHA after controller transition: `{blob_sha}`.
          - Post-transition controller integrity and phase-coherence check: `PASS`.
          - Current task read from canonical state: `CORE-008-T05 — Implement dispute and reversal rules`.
          - Subtask readback: `CORE-008-T04=DONE`; `CORE-008-T05=CURRENT`.
          - Acceptance-criterion statuses were preserved: AC01=`PENDING`, AC02=`VERIFIED`, AC03=`VERIFIED`, AC04=`PENDING`, AC05=`PENDING`, AC06=`PENDING`.
          - Both generated handoff files identify T05 as current and T04 as done.

          **Final disposition:** Phase 6 (T04 implementation, CI verification, the prescribed Control Center transition and state/handoff readback) is complete. The CORE-008 gate remains open; this does not validate, approve or freeze the gate.
          """).strip()

          evidence_path.write_text(
              evidence.rstrip() + "\n" + section + "\n",
              encoding="utf-8",
          )

          print("POST-CHECK PASS: T04 DONE, T05 CURRENT, acceptance statuses preserved.")
          print(f"STATE_BLOB_SHA={blob_sha}")
          print(f"ACTIONS_RUN={run_url}")
          PY

      - name: Stage only verified controller transition artifacts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          ACTUAL="$(git diff --name-only | LC_ALL=C sort)"
          EXPECTED="$(printf '%s\n' \
            'REOS_CONTROL_CENTER/REOS_NEXT_CHAT.txt' \
            'REOS_CONTROL_CENTER/data/state.json' \
            'REOS_CONTROL_CENTER/evidence/CORE-008/T04-settlement-reconciliation-ci-evidence.md' \
            'REOS_CONTROL_CENTER/packets/NEW_CHAT_PACKET.txt' | LC_ALL=C sort)"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "BLOCKED: controller transition changed an unexpected tracked-file set."
            echo "Expected tracked changes:"
            printf '%s\n' "$EXPECTED"
            echo "Actual tracked changes:"
            printf '%s\n' "$ACTUAL"
            exit 1
          fi

          mapfile -t UNTRACKED_PATHS < <(git ls-files --others --exclude-standard | LC_ALL=C sort)

          if [[ "${#UNTRACKED_PATHS[@]}" -ne 1 ]]; then
            echo "BLOCKED: expected exactly one controller-created state snapshot."
            printf '%s\n' "${UNTRACKED_PATHS[@]}"
            exit 1
          fi

          SNAPSHOT_PATH="${UNTRACKED_PATHS[0]}"

          if [[ ! "$SNAPSHOT_PATH" =~ ^REOS_CONTROL_CENTER/snapshots/state_[0-9]{8}_[0-9]{6}_[0-9]{6}\.json$ ]]; then
            echo "BLOCKED: unexpected untracked path: $SNAPSHOT_PATH"
            exit 1
          fi

          python - "$SNAPSHOT_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path
          from REOS_CONTROL_CENTER.reos_control_center import calculate_hash

          snapshot_path = Path(sys.argv[1])
          snapshot = json.loads(snapshot_path.read_text(encoding="utf-8"))
          stored_hash = snapshot.get("integrity", {}).get("sha256")

          if not isinstance(stored_hash, str) or stored_hash != calculate_hash(snapshot):
              raise SystemExit("BLOCKED: controller-created pre-transition snapshot failed integrity validation.")

          print(f"SNAPSHOT_INTEGRITY=PASS path={snapshot_path}")
          PY

          git add -- \
            REOS_CONTROL_CENTER/data/state.json \
            REOS_CONTROL_CENTER/packets/NEW_CHAT_PACKET.txt \
            REOS_CONTROL_CENTER/REOS_NEXT_CHAT.txt \
            REOS_CONTROL_CENTER/evidence/CORE-008/T04-settlement-reconciliation-ci-evidence.md \
            "$SNAPSHOT_PATH"

          STAGED="$(git diff --cached --name-only | LC_ALL=C sort)"
          EXPECTED_STAGED="$(printf '%s\n' \
            'REOS_CONTROL_CENTER/REOS_NEXT_CHAT.txt' \
            'REOS_CONTROL_CENTER/data/state.json' \
            'REOS_CONTROL_CENTER/evidence/CORE-008/T04-settlement-reconciliation-ci-evidence.md' \
            'REOS_CONTROL_CENTER/packets/NEW_CHAT_PACKET.txt' \
            "$SNAPSHOT_PATH" | LC_ALL=C sort)"

          if [[ "$STAGED" != "$EXPECTED_STAGED" ]]; then
            echo "BLOCKED: staged paths do not match the exact approved controller transition set."
            echo "Expected staged paths:"
            printf '%s\n' "$EXPECTED_STAGED"
            echo "Actual staged paths:"
            printf '%s\n' "$STAGED"
            exit 1
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(control-center): complete CORE-008-T04 via controller"

      - name: Push without force and read back canonical state
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_COMMIT="$(git rev-parse HEAD)"

          git push origin HEAD:refs/heads/reos-development
          git fetch --no-tags origin refs/heads/reos-development
          REMOTE_SHA="$(git rev-parse FETCH_HEAD)"

          if ! git merge-base --is-ancestor "$LOCAL_COMMIT" "$REMOTE_SHA"; then
            echo "READBACK FAILED: the transition commit is not an ancestor of canonical branch HEAD."
            exit 1
          fi

          git show "$REMOTE_SHA:REOS_CONTROL_CENTER/data/state.json" \
            > "$RUNNER_TEMP/reos-state-readback.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(
              Path(
                  os.environ["RUNNER_TEMP"],
                  "reos-state-readback.json",
              ).read_text(encoding="utf-8")
          )

          execution = state.get("execution", {})
          gate = state.get("gate_plans", {}).get("CORE-008", {})
          subtasks = {
              item.get("id"): item
              for item in gate.get("subtasks", [])
          }
          criteria = {
              item.get("id"): item.get("status")
              for item in gate.get("criteria_state", [])
          }

          expected = {
