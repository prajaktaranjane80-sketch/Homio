name: HOMIO Backend and ACRL Runtime CI

on:
  push:
    branches:
      - reos-development
    paths:
      - "REOS_CONTROL_CENTER/AUTONOMY_ENGINE/**"
      - "REOS_CONTROL_CENTER/Frontend/**"
      - "REOS_CONTROL_CENTER/context/**"
      - "REOS_CONTROL_CENTER/tets/**"
      - "REOS_CONTROL_CENTER/reos_control_center.py"
      - "REOS_CONTROL_CENTER/data/state.json"
      - "REOS_CONTROL_CENTER/requirements-auth.txt"
      - "REOS_CONTROL_CENTER/AI_AGENT_ENTRYPOINT.py"
      - "REOS_CONTROL_CENTER/evidence/**"
      - "REOS_CONTROL_CENTER/packets/**"
      - "REOS_CONTROL_CENTER/REOS_NEXT_CHAT.txt"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/reusable-backend-verification.yml"
      - ".github/workflows/reusable-core008-t06-transition.yml"
      - ".github/workflows/reusable-core008-t07-transition.yml"
      - ".github/workflows/reusable-core008-t08-transition.yml"
      - ".github/workflows/reusable-core008-t09-transition.yml"
      - ".github/actions/homio-backend-ci/**"

  pull_request:
    branches:
      - reos-development
    paths:
      - "REOS_CONTROL_CENTER/AUTONOMY_ENGINE/**"
      - "REOS_CONTROL_CENTER/Frontend/**"
      - "REOS_CONTROL_CENTER/context/**"
      - "REOS_CONTROL_CENTER/tets/**"
      - "REOS_CONTROL_CENTER/reos_control_center.py"
      - "REOS_CONTROL_CENTER/data/state.json"
      - "REOS_CONTROL_CENTER/requirements-auth.txt"
      - "REOS_CONTROL_CENTER/AI_AGENT_ENTRYPOINT.py"
      - "REOS_CONTROL_CENTER/evidence/**"
      - "REOS_CONTROL_CENTER/packets/**"
      - "REOS_CONTROL_CENTER/REOS_NEXT_CHAT.txt"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/reusable-backend-verification.yml"
      - ".github/workflows/reusable-core008-t06-transition.yml"
      - ".github/workflows/reusable-core008-t07-transition.yml"
      - ".github/workflows/reusable-core008-t08-transition.yml"
      - ".github/workflows/reusable-core008-t09-transition.yml"
      - ".github/actions/homio-backend-ci/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homio-backend-acrl-ci-${{ github.ref }}
  cancel-in-progress: false

# T06 through T08 are DONE in canonical state.
# T09 runs only from the exact owner-authorized commit prefix.
# CORE-008 acceptance criteria remain separately evidence-gated.

jobs:
  verification:
    name: Backend, T21, and ACRL runtime verification
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-backend-verification.yml

  control_center_transition_t06:
    name: Guarded Control Center transition (CORE-008-T06)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/reos-development' && startsWith(github.event.head_commit.message, '[CONTROL-CENTER-COMPLETE-CORE-008-T06]') }}
    needs: verification
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-core008-t06-transition.yml

  control_center_transition_t07:
    name: Guarded Control Center transition (CORE-008-T07)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/reos-development' && startsWith(github.event.head_commit.message, '[CONTROL-CENTER-COMPLETE-CORE-008-T07]') }}
    needs: verification
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-core008-t07-transition.yml

  control_center_transition_t08:
    name: Guarded Control Center transition (CORE-008-T08)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/reos-development' && startsWith(github.event.head_commit.message, '[CONTROL-CENTER-COMPLETE-CORE-008-T08]') }}
    needs: verification
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-core008-t08-transition.yml

  control_center_transition_t09:
    name: Guarded Control Center transition (CORE-008-T09)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/reos-development' && startsWith(github.event.head_commit.message, '[CONTROL-CENTER-COMPLETE-CORE-008-T09]') }}
    needs: verification
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-core008-t09-transition.yml
