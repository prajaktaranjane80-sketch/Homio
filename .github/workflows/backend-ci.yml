
name: HOMIO Backend and Full ACRL CI

on:
  push:
    branches:
      - reos-development
    paths:
      - "REOS_CONTROL_CENTER/AUTONOMY_ENGINE/**"
      - "REOS_CONTROL_CENTER/Frontend/**"
      - "REOS_CONTROL_CENTER/context/**"
      - "REOS_CONTROL_CENTER/tets/**"
      - "REOS_CONTROL_CENTER/reos_control_center.py"
      - "REOS_CONTROL_CENTER/data/state.json"
      - "REOS_CONTROL_CENTER/requirements-auth.txt"
      - "REOS_CONTROL_CENTER/AI_AGENT_ENTRYPOINT.py"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - reos-development
    paths:
      - "REOS_CONTROL_CENTER/AUTONOMY_ENGINE/**"
      - "REOS_CONTROL_CENTER/Frontend/**"
      - "REOS_CONTROL_CENTER/context/**"
      - "REOS_CONTROL_CENTER/tets/**"
      - "REOS_CONTROL_CENTER/reos_control_center.py"
      - "REOS_CONTROL_CENTER/data/state.json"
      - "REOS_CONTROL_CENTER/requirements-auth.txt"
      - "REOS_CONTROL_CENTER/AI_AGENT_ENTRYPOINT.py"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homio-backend-acrl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Backend, EntryPoint, and Full ACRL Verification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: REOS_CONTROL_CENTER

    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: REOS_CONTROL_CENTER/requirements-auth.txt

      - name: Install test and authentication dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -r requirements-auth.txt

      - name: Validate required EntryPoint contract test
        run: |
          python -c "from pathlib import Path; p = Path('tets/test_ai_agent_entrypoint_contract.py'); assert p.is_file(), f'Required contract test is missing: {p}'"

      - name: Compile backend, context, and complete ACRL source
        run: |
          python -m compileall -q \
            reos_control_center.py \
            AI_AGENT_ENTRYPOINT.py \
            context \
            AUTONOMY_ENGINE/continuity/acrl

      - name: Run EntryPoint contract regression
        run: |
          python -m pytest -q \
            tets/test_ai_agent_entrypoint_contract.py

      - name: Run complete ACRL test suite
        run: |
          python -m pytest -q \
            AUTONOMY_ENGINE/continuity/acrl

      - name: Run canonical truth, authentication, finance, context, and tenant regressions
        run: |
          python -m pytest -q \
            AUTONOMY_ENGINE/continuity/canonical_truth/STAGE0_Canonical_Truth_Sync_Engine \
            AUTONOMY_ENGINE/security/authentication \
            AUTONOMY_ENGINE/core/commission_financial \
            tets/test_l3_canonical_authority.py \
            context/test_phase_projection.py \
            AUTONOMY_ENGINE/core/identity_tenant
