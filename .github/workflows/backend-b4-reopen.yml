name: HOMIO Guarded B4 Recovery Reopen

on:
  push:
    branches:
      - reos-development
    # Run only after the complete guarded B4 bundle is present.
    # The commit prefix is explicit owner authorization.
    # Retry uses the corrected porcelain whitespace-preserving parser.
    paths:
      - ".github/workflows/backend-b4-reopen.yml"

permissions:
  contents: read

concurrency:
  group: homio-b4-reopen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification:
    name: Exact-SHA backend, PostgreSQL, Redis and ACRL verification
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/reos-development' &&
        github.actor == 'prajaktaranjane80-sketch' &&
        startsWith(
          github.event.head_commit.message,
          '[CONTROL-CENTER-REOPEN-BACKEND-001-B4]'
        )
      }}
    uses: ./.github/workflows/reusable-backend-verification.yml

  reopen_backend_b4:
    name: Owner-authorized B4 recovery correction and state readback
    needs: verification
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/reos-development' &&
        github.actor == 'prajaktaranjane80-sketch' &&
        startsWith(
          github.event.head_commit.message,
          '[CONTROL-CENTER-REOPEN-BACKEND-001-B4]'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_SHA: ${{ github.sha }}
      VERIFIED_CODE_SHA: ${{ github.sha }}
      ACTIONS_RUN_ID: ${{ github.run_id }}
      ACTIONS_RUN_ATTEMPT: ${{ github.run_attempt }}

    steps:
      - name: Preserve deterministic Git line endings
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout exact owner-approved source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the existing Control Center authorization dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check \
            -r REOS_CONTROL_CENTER/requirements-auth.txt
          python -m pip install --disable-pip-version-check \
            "qdrant-client==1.20.0"

      - name: Run guarded B4 recovery reopen transition
        uses: ./.github/actions/homio-backend-ci/transitions/backend-b4-reopen
