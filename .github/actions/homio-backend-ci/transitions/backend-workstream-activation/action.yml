name: Guarded Backend Workstream Activation
description: >
  Validates owner approval, immutable GitHub OIDC identity, T15 proposal,
  T17 fail-closed impact analysis and T18 authorization before the existing
  Control Center activates BACKEND-001 through the guarded compatibility
  wrapper.

runs:
  using: composite
  steps:
    - name: Execute guarded backend workstream activation
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      run: |
        set -euo pipefail
        python "$GITHUB_ACTION_PATH/scripts/activate_backend_workstream_wrapper.py"
