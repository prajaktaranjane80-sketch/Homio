
name: HOMIO backend and ACRL verification modules
description: Runs focused compile, transition wiring, subsystem regressions, the unified Fastify backend, and the complete ACRL suite.

runs:
  using: composite
  steps:
    - name: Restore previous derived T14 audit resume cache
      id: restore_resume_cache
      if: ${{ github.repository == 'prajaktaranjane80-sketch/Homio' && github.ref == 'refs/heads/reos-development' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/homio-acrl/audit_resume_manifest.json
        key: homio-acrl-resume-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          homio-acrl-resume-${{ github.ref_name }}-

    - name: Verify workflow and action module wiring
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/wiring_tests.sh"

    - name: Verify pull-request merge governance contract
      shell: bash
      run: |
        set -euo pipefail
        python -m pytest -q -p no:cacheprovider \
          .github/actions/homio-backend-ci/verification/tests/test_pull_request_governance.py

    - name: Verify AI-001-T02 guarded transition wiring
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/ai001_t02_transition_wiring.sh"

    - name: Verify AI-001-T03 guarded transition wiring
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/ai001_t03_transition_wiring.sh"

    - name: Verify AI-001-T04 guarded transition wiring
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/ai001_t04_transition_wiring.sh"

    - name: Verify AI-001-T05 guarded transition wiring
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/ai001_t05_transition_wiring.sh"

    - name: Compile backend and verify contracts, including Section 14
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/compile_and_contracts.sh"

    - name: Verify ACRL runtime integration and resume paths
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/acrl_runtime_resume.sh"

    - name: Verify ACRL authorization, source impact, repair, Git, checkpoints, and evidence
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/acrl_security_git_evidence.sh"

    - name: Verify canonical truth, financial, context, authentication, and tenant regressions
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/financial_context_tenant.sh"

    - name: Run complete ACRL suite
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/acrl_full_suite.sh"

    # BACKEND-001-B1: Unified Fastify API foundation.

    - name: Set up Node.js 24 for the unified Fastify API
      if: ${{ hashFiles('REOS_CONTROL_CENTER/backend/package.json') != '' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"

    - name: Generate initial lockfile and verify backend
      id: backend_node_verify
      if: ${{ hashFiles('REOS_CONTROL_CENTER/backend/package.json') != '' }}
      shell: bash
      working-directory: REOS_CONTROL_CENTER/backend
      run: |
        set -euo pipefail

        if [[ ! -f package-lock.json ]]; then
          echo "Generating the initial npm lockfile."
          npm install --package-lock-only --ignore-scripts --no-audit --fund=false
          echo "lockfile_generated=true" >> "$GITHUB_OUTPUT"
        else
          echo "lockfile_generated=false" >> "$GITHUB_OUTPUT"
        fi

        test -s package-lock.json

        npm ci --no-audit --fund=false
        npm run verify

    - name: Publish generated B1 package lockfile
      if: ${{ always() && steps.backend_node_verify.outputs.lockfile_generated == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: homio-b1-generated-package-lock-${{ github.sha }}
        path: REOS_CONTROL_CENTER/backend/package-lock.json
        if-no-files-found: error
        retention-days: 30

    # Existing ACRL evidence and cache publication.

    - name: Seal and independently read back external T14 resume cache
      if: ${{ success() && github.repository == 'prajaktaranjane80-sketch/Homio' && github.ref == 'refs/heads/reos-development' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      shell: bash
      env:
        HOMIO_ACRL_RESUME_CACHE_PATH: ${{ runner.temp }}/homio-acrl/audit_resume_manifest.json
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}/REOS_CONTROL_CENTER"
        python "$GITHUB_ACTION_PATH/scripts/audit_resume_manifest_cache.py" --refresh-after-ci

    - name: Save refreshed external T14 resume cache
      if: ${{ success() && github.repository == 'prajaktaranjane80-sketch/Homio' && github.ref == 'refs/heads/reos-development' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.restore_resume_cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/homio-acrl/audit_resume_manifest.json
        key: homio-acrl-resume-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Publish sealed external T14 resume cache as run evidence
      if: ${{ success() && github.repository == 'prajaktaranjane80-sketch/Homio' && github.ref == 'refs/heads/reos-development' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: homio-acrl-audit-resume-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/homio-acrl/audit_resume_manifest.json
        if-no-files-found: error
        retention-days: 90

    - name: Publish Section 14 AI quality evaluation evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: homio-ai-section14-quality-evaluation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/homio-ai-section14-quality-evaluation.json
        if-no-files-found: warn
        retention-days: 90
